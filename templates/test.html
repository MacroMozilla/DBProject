<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snickr API Tester</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
h1 { text-align: center; margin-bottom: 20px; color: #e94560; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.card { background: #16213e; border-radius: 8px; padding: 16px; border: 1px solid #0f3460; }
.card h3 { color: #e94560; margin-bottom: 10px; font-size: 15px; }
.card label { display: block; font-size: 12px; color: #aaa; margin-top: 6px; }
.card input { width: 100%; padding: 6px 8px; border: 1px solid #0f3460; border-radius: 4px; background: #1a1a2e; color: #eee; font-size: 13px; margin-top: 2px; }
.card button { margin-top: 10px; padding: 8px 16px; background: #e94560; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
.card button:hover { background: #c73651; }
.card pre { margin-top: 10px; background: #0f3460; padding: 10px; border-radius: 4px; font-size: 12px; max-height: 200px; overflow: auto; white-space: pre-wrap; word-break: break-all; display: none; }
.status { text-align: center; margin-bottom: 16px; padding: 10px; background: #16213e; border-radius: 8px; font-size: 14px; }
.status span { color: #e94560; font-weight: bold; }
</style>
</head>
<body>
<h1>Snickr API Tester</h1>
<div class="status">
  Session: <span id="session-info">not logged in</span>
</div>
<div class="grid">
{% for fn in functions %}
<div class="card">
  <h3>{{ fn.name }}</h3>
  <form onsubmit="return callApi(this, '{{ fn.name }}')">
    {% for p in fn.params %}
    <label>{{ p }}<input name="{{ p }}" placeholder="{{ p }}"></label>
    {% endfor %}
    {% if not fn.params %}
    <span style="font-size:12px;color:#888;">No parameters</span>
    {% endif %}
    <button type="submit">Call {{ fn.name }}</button>
  </form>
  <pre></pre>
</div>
{% endfor %}
</div>

<script>
async function callApi(form, fnName) {
  event.preventDefault();
  const pre = form.parentElement.querySelector('pre');
  pre.style.display = 'block';
  pre.textContent = 'Loading...';

  const kwargs = {};
  const inputs = form.querySelectorAll('input');
  inputs.forEach(input => {
    let val = input.value.trim();
    if (val === '') return;
    // auto-convert numbers and booleans
    if (val === 'true') val = true;
    else if (val === 'false') val = false;
    else if (!isNaN(val) && val !== '') val = Number(val);
    kwargs[input.name] = val;
  });

  try {
    const resp = await fetch('/api/core', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ function: fnName, kwargs: kwargs })
    });
    const data = await resp.json();
    pre.textContent = JSON.stringify(data, null, 2);

    // update session display
    if (fnName === 'login' || fnName === 'register') {
      if (data.ok && data.data && data.data.username) {
        document.getElementById('session-info').textContent = data.data.username + ' (uid=' + data.data.uid + ')';
      }
    } else if (fnName === 'logout') {
      document.getElementById('session-info').textContent = 'not logged in';
    } else if (fnName === 'me' && data.ok && data.data && data.data.username) {
      document.getElementById('session-info').textContent = data.data.username + ' (uid=' + data.data.uid + ')';
    } else if (fnName === 'initialize') {
      document.getElementById('session-info').textContent = 'not logged in (DB reset)';
    }
  } catch (e) {
    pre.textContent = 'Error: ' + e.message;
  }
  return false;
}

// Check session on load
fetch('/api/core', {
  method: 'POST',
  credentials: 'include',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ function: 'me' })
}).then(r => r.json()).then(d => {
  if (d.ok && d.data && d.data.username) {
    document.getElementById('session-info').textContent = d.data.username + ' (uid=' + d.data.uid + ')';
  }
}).catch(() => {});
</script>
</body>
</html>
