name: Manual Docker Build & Push

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 0. Checkout code
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # 1. Set version (BRANCH-YYMMDD-RELEASE-SHORTSHA)
      # -------------------------
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Set Version
        id: vars
        run: |
          RELEASE_VERSION=$(yq -r '.version' release.yaml)
          DATE=$(date +'%y%m%d')
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[\/\-]/_/g')
          VERSION="${BRANCH}-${DATE}-${RELEASE_VERSION}-${SHA}"

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_ENV
          echo "📦 VERSION=${VERSION}"

      # -------------------------
      # 2. Build Docker image
      # -------------------------
      - name: Build Docker image
        run: |
          docker build -f Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/snickr:${{ env.VERSION }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/snickr:latest .

      # -------------------------
      # 3. Login to Docker Hub
      # -------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------
      # 4. Push Docker image
      # -------------------------
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/snickr:${{ env.VERSION }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/snickr:latest
