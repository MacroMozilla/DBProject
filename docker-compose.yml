version: "3.9"

services:
  db:
    image: postgres:15
    container_name: snickr_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sqls:/docker-entrypoint-initdb.d 

  web:
    build: .
    container_name: snickr_web
    command: ./wait-for-db.sh
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

volumes:
  postgres_data: